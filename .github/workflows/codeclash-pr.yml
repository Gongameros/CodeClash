name: Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/codeclash-ci-template.yml
    with:
      dotnet-version: '10.x'
      run-tests: true
      upload-artifacts: false
