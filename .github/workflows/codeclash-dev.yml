name: Dev Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/codeclash-ci-template.yml
    with:
      dotnet-version: '10.x'
      run-tests: true
      upload-artifacts: false

  cd:
    name: CD
    needs: ci
    uses: ./.github/workflows/codeclash-cd-template.yml
    with:
      environment: dev
      dotnet-version: '10.x'
      build-version: ${{ needs.ci.outputs.build-version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
