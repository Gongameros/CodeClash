name: CI Template

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version to use
        type: string
        default: '10.x'
      run-tests:
        description: Whether to run tests
        type: boolean
        default: true
      upload-artifacts:
        description: Whether to upload build artifacts
        type: boolean
        default: false
    outputs:
      build-version:
        description: The computed build version
        value: ${{ jobs.build.outputs.build-version }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Compute version
        id: version
        run: |
          VERSION="0.0.0-${GITHUB_SHA::8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${VERSION}"

      - name: Restore dependencies
        run: dotnet restore src/Services/AspireHost/CodeClash.AppHost/CodeClash.AppHost.csproj

      - name: Build AppHost (all services)
        run: |
          dotnet build src/Services/AspireHost/CodeClash.AppHost/CodeClash.AppHost.csproj \
            --no-restore \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Upload build artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.version.outputs.version }}
          path: |
            src/**/bin/Release/**
            !src/**/bin/Release/**/*.pdb
          retention-days: 3

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    if: inputs.run-tests

    strategy:
      fail-fast: false
      matrix:
        test-project:
          - src/Services/Courses/CodeClash.Courses.Tests/CodeClash.Courses.Tests.csproj
          - src/Services/Coders/CodeClash.Coders.Tests/CodeClash.Coders.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore ${{ matrix.test-project }}

      - name: Run tests
        run: |
          dotnet test ${{ matrix.test-project }} \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --settings ${{ github.workspace }}/coverlet.runsettings \
            --results-directory ./test-results/${{ strategy.job-index }}
        env:
          DOTNET_ENVIRONMENT: Test

      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ strategy.job-index }}
          path: ./test-results/${{ strategy.job-index }}/**/coverage.cobertura.xml

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: inputs.run-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore tests/CodeClash.E2E.Tests/CodeClash.E2E.Tests.csproj

      - name: Build E2E tests
        run: |
          dotnet build tests/CodeClash.E2E.Tests/CodeClash.E2E.Tests.csproj \
            --no-restore \
            --configuration Release

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $playwrightScript = Get-ChildItem -Recurse -Filter "playwright.ps1" `
            -Path tests/CodeClash.E2E.Tests/bin/Release `
            | Select-Object -First 1 -ExpandProperty FullName
          & $playwrightScript install --with-deps chromium

      - name: Run E2E tests
        run: |
          dotnet test tests/CodeClash.E2E.Tests/CodeClash.E2E.Tests.csproj \
            --no-restore \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --settings ${{ github.workspace }}/coverlet.runsettings \
            --results-directory ./test-results/e2e
        env:
          DOTNET_ENVIRONMENT: Test

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test, test-e2e]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-input

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Add tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate merged HTML report
        run: |
          reportgenerator \
            -reports:coverage-input/**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:"HtmlSummary;Html"

      - name: Upload coverage html
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
