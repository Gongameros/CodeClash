name: CI Template

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version to use
        type: string
        default: '10.x'
      run-tests:
        description: Whether to run tests
        type: boolean
        default: true
      upload-artifacts:
        description: Whether to upload build artifacts
        type: boolean
        default: false
    outputs:
      build-version:
        description: The computed build version
        value: ${{ jobs.build.outputs.build-version }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Compute version
        id: version
        run: |
          VERSION="0.0.0-${GITHUB_SHA::8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${VERSION}"

      - name: Restore dependencies
        run: dotnet restore src/Services/AspireHost/CodeClash.AppHost/CodeClash.AppHost.csproj

      - name: Build AppHost (all services)
        run: |
          dotnet build src/Services/AspireHost/CodeClash.AppHost/CodeClash.AppHost.csproj \
            --no-restore \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Upload build artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.version.outputs.version }}
          path: |
            src/**/bin/Release/**
            !src/**/bin/Release/**/*.pdb
          retention-days: 3

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    if: inputs.run-tests

    strategy:
      fail-fast: false
      matrix:
        test-project:
          - src/Services/Courses/CodeClash.Courses.Tests/CodeClash.Courses.Tests.csproj
          - src/Services/Coders/CodeClash.Coders.Tests/CodeClash.Coders.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore ${{ matrix.test-project }}

      - name: Run tests
        run: |
          dotnet test ${{ matrix.test-project }} \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results
        env:
          DOTNET_ENVIRONMENT: Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: ./test-results/**/*.trx
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: ./test-results/**/coverage.cobertura.xml
          retention-days: 7
